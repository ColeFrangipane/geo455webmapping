<!DOCTYPE html>
<html>
<head>
    <title>Loading GeoJSON from object</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <style>
        body {
            padding: 0;
            margin: 0;
        }
        html, body, #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>
<div id="map"></div>

<script>

let map = L.map("map").setView([43, -105], 4);

L.tileLayer("https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_nolabels/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap &copy; CartoDB',
    subdomains: "abcd",
    maxZoom: 19
}).addTo(map);

let states = {
  "type": "FeatureCollection",
  "features": [

    {
      "type": "Feature",
      "properties": {"Name": "North Dakota"},
      "geometry": {
        "type": "Polygon",
        "coordinates": [
          [
            [-104.05, 48.99],
            [-97.22, 48.98],
            [-96.58, 45.94],
            [-104.03, 45.94],
            [-104.05, 48.99]
          ]
        ]
      }
    },

    {
      "type": "Feature",
      "properties": {"Name": "Colorado"},
      "geometry": {
        "type": "Polygon",
        "coordinates": [
          [
            [-109.05, 41.00],
            [-102.06, 40.99],
            [-102.03, 36.99],
            [-109.04, 36.99],
            [-109.05, 41.00]
          ]
        ]
      }
    },

    {
      "type": "Feature",
      "properties": {"Name": "New Mexico"},
      "geometry": {
        "type": "Polygon",
        "coordinates": [
          [
            [-109.03965755067327, 31.3339007181],
            [-108.20003808842216, 31.34308668426074],
            [-108.18964159364324, 31.768116418655694],
            [-106.67252399776464, 31.766524503098054],
            [-106.61961396250763, 31.994419768177806],
            [-103.08929816693623, 32.01457099872913],
            [-102.94637135593103, 37.01361248419602],
            [-109.04407623267974, 37.03572097513792],
            [-109.03965755067327, 31.33390071813946]
          ]
        ]
      }
    }

  ]
};

L.geoJSON(states).addTo(map);

</script>

</body>
</html>
