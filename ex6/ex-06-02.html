<body>
    <div id="map"></div>
    <script>

let map = L.map("map").setView([39, -100], 5);

L.tileLayer("https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_nolabels/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attribution/">CartoDB</a>',
    subdomains: "abcd",
    maxZoom: 19
}).addTo(map);

// Load GeoJSON from an external file
L.geoJSON(county).addTo(map);
        L.control.scale().addTo(map);       
        
// custom earthquake icon
let earthquakeIcon = L.icon({
    iconUrl: "https://upload.wikimedia.org/wikipedia/commons/5/5f/Map_marker_icon_%E2%80%93_Nicolas_Mollet_%E2%80%93_Earthquake_%E2%80%93_Events_%E2%80%93_Classic.png",
    iconSize: [32, 37],
